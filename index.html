<script>

const state = {
  page: 'home',
  role: null,
  availabilityTraining: null,
  availabilityMatch: null
};

const SUPABASE_URL = 'https://lvrvjxghsxqkflcvjkhx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bakcdWKDHgMH7lUvgb57Eg_F5Ul4-4d';
let currentSession = JSON.parse(localStorage.getItem('fcbb_session') || 'null');


async function ensureSession(){
  if(!currentSession) throw new Error('Session expirée. Reconnecte-toi.');

  // If access token is still valid for at least 60 seconds, keep it.
  try{
    const payload = JSON.parse(atob(currentSession.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(payload.exp && (payload.exp * 1000) > Date.now() + 60000) return currentSession;
  }catch(e){}

  if(!currentSession.refresh_token) throw new Error('Session expirée. Reconnecte-toi.');

  const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
    body:JSON.stringify({refresh_token: currentSession.refresh_token})
  });
  const data = await response.json();
  if(!response.ok){
    localStorage.removeItem('fcbb_session');
    currentSession = null;
    throw new Error('Session expirée. Reconnecte-toi.');
  }
  currentSession = data;
  localStorage.setItem('fcbb_session', JSON.stringify(data));
  return currentSession;
}

async function sbFetch(path, options={}){
  const session = await ensureSession();
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${session.access_token}`
  }, options.headers || {});
  return fetch(`${SUPABASE_URL}${path}`, Object.assign({}, options, {headers}));
}

function escapeHtml(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')

async function realLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const message = document.getElementById('login-message');
  const button = document.getElementById('login-button');

  if(!email || !password){
    message.textContent = 'Entre ton e-mail et ton mot de passe.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Connexion...';
  message.textContent = '';

  try{
    const authResponse = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({email, password})
    });

    const authData = await authResponse.json();
    if(!authResponse.ok) throw new Error(authData.error_description || authData.msg || 'Connexion impossible.');

    currentSession = authData;
    localStorage.setItem('fcbb_session', JSON.stringify(authData));

    const profileResponse = await fetch(`${SUPABASE_URL}/rest/v1/profils?id=eq.${encodeURIComponent(authData.user.id)}&select=role,prenom,nom`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authData.access_token}`
      }
    });

    const profiles = await profileResponse.json();
    if(!profileResponse.ok) throw new Error('Impossible de lire le profil FCB.');

    const profile = profiles[0];
    if(!profile){
      localStorage.removeItem('fcbb_session');
      currentSession = null;
      throw new Error("Ce compte n'a pas encore de profil FCB.");
    }

    state.role = profile.role;
    state.page = profile.role === 'dirigeant' ? 'manager' : 'player';
    render();
  }catch(err){
    message.textContent = err.message || 'Erreur de connexion.';
  }finally{
    button.disabled = false;
    button.textContent = 'Se connecter';
  }
}

async function loadBaseData(){
  let fcbbTeams = [];
let fcbbPlayers = [];
let fcbbEvents = [];
let fcbbEventTeams = [];


async function loadBaseData(){

  const [tr, pr, er, etr] = await Promise.all([

    sbFetch(
      '/rest/v1/equipes?select=id,nom&actif=eq.true&order=nom.asc'
    ),

    sbFetch(
      '/rest/v1/joueurs?select=id,prenom,nom,numero,poste,photo_url,actif,user_id,equipe_id&actif=eq.true&order=nom.asc,prenom.asc'
    ),

    sbFetch(
      '/rest/v1/evenements?select=*&order=date_heure.desc'
    ),

    sbFetch(
      '/rest/v1/evenement_equipes?select=evenement_id,equipe_id'
    )

  ]);


  const t = await tr.json();
  const p = await pr.json();
  const e = await er.json();
  const et = await etr.json();


  if(!tr.ok){
    throw new Error(
      t.message || 'Erreur équipes'
    );
  }

  if(!pr.ok){
    throw new Error(
      p.message || 'Erreur joueurs'
    );
  }

  if(!er.ok){
    throw new Error(
      e.message || 'Erreur événements'
    );
  }

  if(!etr.ok){
    throw new Error(
      et.message ||
      'Erreur associations événements/équipes'
    );
  }


  fcbbTeams = t;
  fcbbPlayers = p;
  fcbbEvents = e;
  fcbbEventTeams = et;
}


function teamName(id){

        Number(eventId)

        Number(row.equipe_id)

  return eventTeamIds(eventId)

  async function toggleEventCancelled(id, cancelled){

  const message =
    cancelled
      ? 'Annuler cet événement ?'
      : 'Réactiver cet événement ?';

  if(!confirm(message)){
    return;
  }

  try{

    const response =
      await sbFetch(
        `/rest/v1/evenements?id=eq.${id}`,
        {
          method:'PATCH',
          headers:{
            'Content-Type':'application/json',
            'Prefer':'return=minimal'
          },
          body:JSON.stringify({
            annule:cancelled
          })
        }
      );

    if(!response.ok){

      let errorMessage =
        'Impossible de modifier cet événement.';

      try{
        const error =
          await response.json();

        errorMessage =
          error.message ||
          error.details ||
          errorMessage;
      }catch(_){}

      throw new Error(errorMessage);
    }

    await initEvents();

  }catch(error){

    alert(error.message);

  }

}


async function deleteEvent(id){

  const event =
    fcbbEvents.find(
      e => Number(e.id) === Number(id)
    );

  const label =
    event
      ? eventLabel(event)
      : `Événement #${id}`;

  const confirmed =
    confirm(
      `Supprimer définitivement :\n\n${label}\n\nCette action est irréversible.`
    );

  if(!confirmed){
    return;
  }

  try{

    const relatedTables = [
      'disponibilites',
      'convocations',
      'compositions',
      'statistiques_match',
      'notes_joueurs',
      'resultats'
    ];

    for(const table of relatedTables){

      const response =
        await sbFetch(
          `/rest/v1/${table}?evenement_id=eq.${id}`,
          {
            method:'DELETE',
            headers:{
              'Prefer':'return=minimal'
            }
          }
        );

      if(!response.ok){

        let errorMessage =
          `Erreur lors du nettoyage de ${table}.`;

        try{
          const error =
            await response.json();

          errorMessage =
            error.message ||
            error.details ||
            errorMessage;
        }catch(_){}

        throw new Error(errorMessage);
      }
    }

    const eventResponse =
      await sbFetch(
        `/rest/v1/evenements?id=eq.${id}`,
        {
          method:'DELETE',
          headers:{
            'Prefer':'return=minimal'
          }
        }
      );

    if(!eventResponse.ok){

      let errorMessage =
        'Impossible de supprimer l’événement.';

      try{
        const error =
          await eventResponse.json();

        errorMessage =
          error.message ||
          error.details ||
          errorMessage;
      }catch(_){}

      throw new Error(errorMessage);
    }

    alert('Événement supprimé ✅');

    await initEvents();

  }catch(error){

    alert(error.message);

  }

      }
async function saveEvent(){

  const msg =
    document.getElementById('ev-msg');

  const type =
    document.getElementById('ev-type').value;

  const selectedTeams =
    [...document.querySelectorAll('.ev-team-check:checked')]
      .map(input => Number(input.value));

  const date =
    document.getElementById('ev-date').value;


  if(!selectedTeams.length || !date){

    msg.textContent =
      'Sélectionne au moins une équipe et une date.';

    return;
  }


  if(
    type === 'match' &&
    selectedTeams.length !== 1
  ){

    msg.textContent =
      'Un match doit être associé à une seule équipe.';

    return;
  }


  const primaryTeamId =
    selectedTeams[0];


  const payload = {

    equipe_id: primaryTeamId,

    type,

    date_heure:
      new Date(date).toISOString(),

    lieu:
      document
        .getElementById('ev-place')
        .value
        .trim() || null,

    titre:
      type === 'match'
        ? 'Match'
        : 'Entraînement',

    adversaire:
      type === 'match'
        ? (
            document
              .getElementById('ev-opp')
              .value
              .trim() || null
          )
        : null,

    domicile:
      type === 'match'
        ? (
            document
              .getElementById('ev-home')
              .value === 'true'
          )
        : null

  };


  try{

    const response =
      await sbFetch(
        '/rest/v1/evenements',
        {
          method:'POST',

          headers:{
            'Content-Type':'application/json',
            'Prefer':'return=representation'
          },

          body:
            JSON.stringify(payload)
        }
      );


    const created =
      await response.json();


    if(!response.ok){

      throw new Error(
        created.message ||
        'Impossible de créer l’événement.'
      );

    }


    const event =
      created[0];


    const rows =
      selectedTeams.map(teamId => ({
        evenement_id:event.id,
        equipe_id:teamId
      }));


    const linkResponse =
      await sbFetch(
        '/rest/v1/evenement_equipes',
        {
          method:'POST',

          headers:{
            'Content-Type':'application/json',
            'Prefer':'return=minimal'
          },

          body:
            JSON.stringify(rows)
        }
      );


    if(!linkResponse.ok){

      let errorMessage =
        'Événement créé, mais impossible d’associer les équipes.';

      try{

        const error =
          await linkResponse.json();

        errorMessage =
          error.message ||
          error.details ||
          errorMessage;

      }catch(_){}


      throw new Error(errorMessage);

    }


    msg.textContent =
      type === 'match'
        ? 'Match créé ✅'
        : (
            selectedTeams.length > 1
            ? `Entraînement commun créé pour ${selectedTeams.length} équipes ✅`
            : 'Entraînement créé ✅'
          );


    await initEvents();


  }catch(error){

    msg.textContent =
      error.message;

  }

}

async function loadManagerPlayers(){
  const list = document.getElementById('manager-player-list');
  if(!list) return;
  try{
    const [playersRes, teamsRes] = await Promise.all([
      sbFetch('/rest/v1/joueurs?select=id,prenom,nom,numero,poste,photo_url,actif,equipe_id&order=nom.asc,prenom.asc'),
      sbFetch('/rest/v1/equipes?select=id,nom&actif=eq.true&order=nom.asc')
    ]);
    const players = await playersRes.json();
    const teams = await teamsRes.json();
    if(!playersRes.ok) throw new Error(players.message || 'Impossible de charger les joueurs.');
    if(!teamsRes.ok) throw new Error(teams.message || 'Impossible de charger les équipes.');

    managerPlayersCache = players;
    managerTeamsCache = teams;
    renderTeamSelect();
    function eventTeamCheckboxes(){

  return `
    <div class="event-team-grid">

      ${fcbbTeams.map(team => `

        <label class="event-team-choice">

          <input
            type="checkbox"
            class="ev-team-check"
            value="${team.id}">

          <span>
            ${escapeHtml(team.nom)}
          </span>

        </label>

      `).join('')}

    </div>
  `;
}

    if(players.length === 0){
      list.innerHTML = `<div class="card"><strong>Aucun joueur pour le moment.</strong><p class="muted">Appuie sur “Ajouter un joueur”.</p></div>`;
      return;
    }

    const teamMap = Object.fromEntries(teams.map(t=>[t.id,t.nom]));
    list.innerHTML = `<div class="list">${players.map(p=>`
      <div class="card player-card" style="${p.actif ? '' : 'opacity:.55'}">
        ${p.photo_url
          ? `<img class="avatar" src="${escapeHtml(p.photo_url)}" alt="">`
          : `<div class="avatar" style="display:grid;place-items:center;font-size:28px">👤</div>`}
        <div style="flex:1">
          <strong>${escapeHtml(p.prenom)} ${escapeHtml(p.nom)}</strong>
          <div class="muted">#${p.numero ?? '—'} • ${escapeHtml(p.poste || 'Poste non renseigné')}</div>
          <div class="small">${escapeHtml(teamMap[p.equipe_id] || 'Équipe non renseignée')} ${p.actif ? '' : '• Inactif'}</div>
        </div>
        <button class="btn-primary" style="padding:9px 12px" onclick="editPlayer(${p.id})">Modifier</button>
      </div>`).join('')}</div>`;
  }catch(err){
    list.innerHTML = `<div class="card"><strong>Erreur</strong><p>${escapeHtml(err.message)}</p></div>`;
  }

function editPlayer(id){
  const p = managerPlayersCache.find(x=>x.id===id);
  if(!p) return;
  openPlayerForm();
  document.getElementById('player-form-title').textContent = 'Modifier le joueur';
  document.getElementById('player-id').value = p.id;
  document.getElementById('player-current-photo').value = p.photo_url || '';
  document.getElementById('player-firstname').value = p.prenom || '';
  document.getElementById('player-lastname').value = p.nom || '';
  document.getElementById('player-number').value = p.numero ?? '';
  document.getElementById('player-position').value = p.poste || '';
  renderTeamSelect(p.equipe_id);
  document.getElementById('photo-preview-wrap').innerHTML = p.photo_url
    ? `<img class="avatar" src="${escapeHtml(p.photo_url)}" alt="Photo actuelle">`
    : '';
}

async function uploadPlayerPhoto(file){
  if(!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
  const safeName = `joueur_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const objectPath = encodeURIComponent(safeName);
  const response = await sbFetch(`/storage/v1/object/photos-joueurs/${objectPath}`, {
    method:'POST',
    headers:{
      'Content-Type': file.type || 'image/jpeg',
      'x-upsert':'true'
    },
    body:file
  });
  if(!response.ok){
    let msg='Échec de l’envoi de la photo.';
    try{ const e=await response.json(); msg=e.message || e.error || msg; }catch(_){}
    throw new Error(msg);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/photos-joueurs/${objectPath}`;
}

  const file = document.getElementById('player-photo').files[0];
  const currentPhoto = document.getElementById('player-current-photo').value;
  const message = document.getElementById('player-form-message');

  if(!firstname || !lastname || !teamId){
    message.textContent = 'Prénom, nom et équipe sont obligatoires.';
    return;
  }

  message.textContent = 'Enregistrement...';

  try{
    const photoUrl = file ? await uploadPlayerPhoto(file) : (currentPhoto || null);
    const payload = {
      prenom: firstname,
      nom: lastname,
      numero: numberRaw === '' ? null : Number(numberRaw),
      poste: position || null,
      equipe_id: Number(teamId),
      photo_url: photoUrl,
      actif: true
    };

    const response = await sbFetch(id ? `/rest/v1/joueurs?id=eq.${id}` : '/rest/v1/joueurs', {
      method: id ? 'PATCH' : 'POST',
      headers:{
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify(payload)
    });

    if(!response.ok){
      let msg='Impossible d’enregistrer le joueur.';
      try{ const e=await response.json(); msg=e.message || e.details || msg; }catch(_){}
      throw new Error(msg);
    }

    message.textContent = 'Joueur enregistré ✅';
    closePlayerForm();
    await loadManagerPlayers();
  }catch(err){
    message.textContent = err.message;
  }
}

async function publicApi(path){

  const response = await fetch(
    `${SUPABASE_URL}${path}`,
    {
      headers:{
        'apikey': SUPABASE_KEY
      }
    }
  );

  const data = await response.json();

  if(!response.ok){
    throw new Error(
      data.message ||
      'Impossible de charger les données.'
    );
  }

  return data;
}

async function loadPublicMatches(){

  const upcomingBox =
    document.getElementById('public-upcoming');

  const resultsBox =
    document.getElementById('public-results');

  if(!upcomingBox || !resultsBox) return;

  try{

    const [equipes,matches,results] =
      await Promise.all([

        publicApi(
          '/rest/v1/equipes?select=id,nom&actif=eq.true'
        ),

        publicApi(
          '/rest/v1/evenements?select=id,equipe_id,type,date_heure,lieu,adversaire,domicile,titre&type=eq.match&order=date_heure.asc'
        ),

        publicApi(
          '/rest/v1/resultats?select=evenement_id,score_fcbb,score_adversaire'
        )

      ]);


    const equipesMap =
      Object.fromEntries(
        equipes.map(e => [e.id,e])
      );


    const resultsMap =
      Object.fromEntries(
        results.map(r => [r.evenement_id,r])
      );


    const maintenant = new Date();


    const prochains =
      matches
        .filter(m =>
          new Date(m.date_heure) >= maintenant
        )
        .slice(0,10);


    const termines =
      matches
        .filter(m =>
          resultsMap[m.id]
        )
        .sort(
          (a,b) =>
            new Date(b.date_heure) -
            new Date(a.date_heure)
        )
        .slice(0,10);


    upcomingBox.innerHTML =
      prochains.length

      ? `<div class="list">
          ${prochains.map(m =>
            publicMatchCard(
              m,
              equipesMap[m.equipe_id]
            )
          ).join('')}
        </div>`

      : `
        <div class="card">
          Aucun prochain match programmé.
        </div>
      `;


    resultsBox.innerHTML =
      termines.length

      ? `<div class="list">
          ${termines.map(m =>
            publicMatchCard(
              m,
              equipesMap[m.equipe_id],
              resultsMap[m.id]
            )
          ).join('')}
        </div>`

      : `
        <div class="card">
          Aucun résultat disponible.
        </div>
      `;


  }catch(error){

    upcomingBox.innerHTML = `
      <div class="card">
        Impossible de charger les matchs.
        <br>
        <span class="muted">
          ${escapeHtml(error.message)}
        </span>
      </div>
    `;

    resultsBox.innerHTML = '';

  }

}

async function loadPublicRankings(){

  const box =
    document.getElementById('public-rankings');

  if(!box) return;


  try{

    const [equipes,matches,results] =
      await Promise.all([

        publicApi(
          '/rest/v1/equipes?select=id,nom&actif=eq.true&order=nom.asc'
        ),

        publicApi(
          '/rest/v1/evenements?select=id,equipe_id,type,date_heure&type=eq.match'
        ),

        publicApi(
          '/rest/v1/resultats?select=evenement_id,score_fcbb,score_adversaire'
        )

      ]);


    const resultMap =
      Object.fromEntries(
        results.map(
          result => [
            Number(result.evenement_id),
            result
          ]
        )
      );


    const classement =
      equipes.map(equipe => {

        const matchsEquipe =
          matches.filter(match =>
            Number(match.equipe_id) ===
            Number(equipe.id) &&
            resultMap[Number(match.id)]
          );


        let joues = 0;
        let victoires = 0;
        let nuls = 0;
        let defaites = 0;
        let bp = 0;
        let bc = 0;


        matchsEquipe.forEach(match => {

          const resultat =
            resultMap[Number(match.id)];

          const butsFCB =
            Number(resultat.score_fcbb || 0);

          const butsAdversaire =
            Number(resultat.score_adversaire || 0);


          joues++;

          bp += butsFCB;
          bc += butsAdversaire;


          if(butsFCB > butsAdversaire){

            victoires++;

          }else if(
            butsFCB === butsAdversaire
          ){

            nuls++;

          }else{

            defaites++;

          }

        });


        const points =
          victoires * 3 +
          nuls;


        return {

          id:equipe.id,

          nom:equipe.nom,

          joues,

          victoires,

          nuls,

          defaites,

          bp,

          bc,

          difference:
            bp - bc,

          points

        };

      });


    classement.sort((a,b) => {

      if(b.points !== a.points)
        return b.points - a.points;

      if(
        b.difference !==
        a.difference
      )
        return (
          b.difference -
          a.difference
        );

      return b.bp - a.bp;

    });


    if(!classement.length){

      box.innerHTML = `
        <div class="card">
          Aucun classement disponible.
        </div>
      `;

      return;

    }


    box.innerHTML = `

      <div class="ranking-table">

        <div class="ranking-head">

          <span>#</span>

          <span>
            Équipe
          </span>

          <span>
            J
          </span>

          <span>
            Diff.
          </span>

          <span>
            Pts
          </span>

        </div>


        ${classement.map(
          (equipe,index) => `

          <div class="ranking-row">

            <div class="ranking-position">
              ${index + 1}
            </div>


            <div class="ranking-team">

              <img
                src="./club-logo.png"
                alt="FCB">

              <div>

                <strong>
                  ${escapeHtml(equipe.nom)}
                </strong>

                <span>
                  ${equipe.victoires} V
                  •
                  ${equipe.nuls} N
                  •
                  ${equipe.defaites} D
                </span>

              </div>

            </div>


            <div class="ranking-number">
              ${equipe.joues}
            </div>


            <div class="ranking-number">

              ${
                equipe.difference > 0
                ? '+'
                : ''
              }

              ${equipe.difference}

            </div>


            <div class="ranking-points">
              ${equipe.points}
            </div>

          </div>


          <div class="ranking-detail">

            <span>
              ⚽ ${equipe.bp} marqués
            </span>

            <span>
              🥅 ${equipe.bc} encaissés
            </span>

          </div>

        `).join('')}

      </div>

    `;


  }catch(error){

    console.error(
      'Erreur Classements :',
      error
    );


    box.innerHTML = `

      <div class="card">

        <strong>
          Impossible de charger les classements.
        </strong>

        <p class="muted">
          ${escapeHtml(
            error.message ||
            String(error)
          )}
        </p>

      </div>

    `;

  }

}

function render(){
  let html='';
  if(state.page==='home') html=home();
  else if(state.page==='login') html=login();
  else if(state.page==='player') html=playerDashboard();
  else if(state.page==='manager') html=managerDashboard();
  else if(state.page==='managerPlayers') html=managerPlayersPage();
  else if(state.page==='managerEvents') html=managerEventsPage();
  else if(state.page==='managerAttendance') html=managerAttendancePage();
  else if(state.page==='managerCalls') html=managerCallsPage();
  else if(state.page==='managerLineups') html=managerLineupsPage();
  else if(state.page==='managerResults') html=managerResultsPage();
  else if(state.page==='managerStats') html=managerStatsPage();
  else if(state.page==='managerNotes') html=managerNotesPage();
  else if(state.page==='squad') html=squad();
  else if(state.page==='matches') html=publicMatchesPage();
  else if(state.page==='teams') html=generic('Équipes',teams.join(' • '));
  else if(state.page==='rankings') html=publicRankingsPage();
  else if(state.page==='club') html=clubPage();
  document.getElementById('app').innerHTML=`<div class="app-shell">${html}</div>`;
  window.scrollTo(0,0);
  if(state.page==='matches') setTimeout(loadPublicMatches,0);
  if(state.page==='managerPlayers') setTimeout(loadManagerPlayers,0);
  if(state.page==='managerEvents') setTimeout(initEvents,0);
  if(state.page==='managerAttendance') setTimeout(initAttendance,0);
  if(state.page==='managerCalls') setTimeout(initCalls,0);
  if(state.page==='managerLineups') setTimeout(initLineups,0);
  if(state.page==='managerResults') setTimeout(initResults,0);
  if(state.page==='managerStats') setTimeout(initStats,0);
  if(state.page==='managerNotes') setTimeout(initNotes,0);
  if(state.page==='player') setTimeout(loadPlayerLive,0);
  if(state.page==='squad') setTimeout(loadSquad,0);
  if(state.page==='rankings') setTimeout(loadPublicRankings,0);
}
function go(page){state.page=page;render()}
function demo(role){state.role=role;state.page=role==='player'?'player':'manager';render()}
function logout(){currentSession=null;localStorage.removeItem('fcbb_session');state.role=null;state.page='home';render()}
function setAvailability(kind,value){
  if(kind==='training') state.availabilityTraining=value;
  if(kind==='match') state.availabilityMatch=value;
  render();
}
render();

// ===== PWA FCB =====
let fcbInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (event) => {
  event.preventDefault();
  fcbInstallPrompt = event;
  document.getElementById('fcb-install-btn')?.classList.remove('hidden');
});
document.addEventListener('click', async (event) => {
  if(event.target?.id === 'fcb-install-btn' && fcbInstallPrompt){
    fcbInstallPrompt.prompt();
    await fcbInstallPrompt.userChoice;
    fcbInstallPrompt = null;
    event.target.classList.add('hidden');
  }
});
window.addEventListener('appinstalled', () => {
  document.getElementById('fcb-install-btn')?.classList.add('hidden');
});
window.addEventListener('load', () => {
  setTimeout(() => document.getElementById('fcb-splash')?.classList.add('hide'), 650);
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  }
});

</script>
