<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#081a4a">
<title>FC Bouvigny-Boyeffles</title>
<style>

:root{
  --navy:#081a4a;
  --blue:#123b9a;
  --blue2:#2d6df3;
  --yellow:#ffd21c;
  --white:#ffffff;
  --bg:#f3f6ff;
  --text:#0c1c4d;
  --muted:#6b7aa6;
  --green:#159957;
  --red:#d73a49;
  --card:#ffffff;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}
button{font:inherit}
.app-shell{min-height:100vh;padding-bottom:92px}
.hero{
  background:linear-gradient(160deg,var(--navy),#0b225f);
  color:white;
  padding:18px 18px 28px;
  border-radius:0 0 34px 34px;
}
.club-banner{
  width:100%;
  border-radius:18px;
  display:block;
  max-height:240px;
  object-fit:cover;
  margin-bottom:14px;
}
.hero-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.club-title{margin:0;font-size:24px}
.btn-primary{
  border:0;background:var(--yellow);color:var(--navy);
  font-weight:800;padding:13px 18px;border-radius:999px;
}
.page{padding:18px}
.section-title{font-size:26px;margin:18px 0 14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile,.card{
  background:var(--card);
  border-radius:22px;
  padding:18px;
  box-shadow:0 7px 22px rgba(8,26,74,.08);
}
.tile{min-height:112px;font-weight:800;font-size:20px}
.tile.blue{background:linear-gradient(145deg,var(--blue2),var(--blue));color:white}
.tile.yellow{background:var(--yellow);color:var(--navy)}
.match-card{
  background:linear-gradient(145deg,var(--navy),#102865);
  color:white;
}
.row{display:flex;justify-content:space-between;gap:12px;align-items:center}
.badge{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:800}
.badge.blue{background:#1b479e}.badge.green{background:#0d6b51}.badge.red{background:#7a2630}.badge.yellow{background:var(--yellow);color:var(--navy)}
.big-score{font-size:34px;font-weight:900;color:var(--yellow)}
.muted{color:var(--muted)}
.match-card .muted{color:#cbd5f5}
.bottom-nav{
  position:fixed;left:0;right:0;bottom:0;
  background:var(--navy);display:grid;grid-template-columns:repeat(5,1fr);
  padding:10px 5px calc(10px + env(safe-area-inset-bottom));
  z-index:10
}
.nav-btn{
  background:none;border:0;color:#9fb4f3;font-size:12px;
  padding:9px 4px;font-weight:700
}
.nav-btn.active{color:var(--yellow)}
.nav-icon{display:block;font-size:24px;margin-bottom:4px}
.form-group{margin:12px 0}
label{display:block;font-weight:700;margin-bottom:6px}
input,select{
  width:100%;padding:14px;border-radius:14px;border:1px solid #d9e1f5;background:white;font-size:16px
}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn-choice{
  border:0;border-radius:18px;padding:16px;font-weight:900
}
.present{background:#d9f7e7;color:#0a6d42}
.absent{background:#ffe1e4;color:#a52333}
.profile{
  display:flex;gap:14px;align-items:center
}
.avatar{
  width:88px;height:88px;border-radius:22px;background:#dfe6f8;object-fit:cover
}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.stat{text-align:center}.stat strong{display:block;font-size:28px}
.list{display:grid;gap:10px}
.player-card{display:flex;gap:12px;align-items:center}
.player-card .avatar{width:62px;height:62px;border-radius:16px}
.small{font-size:13px}
.hidden{display:none}
.top-back{
  border:0;background:none;color:white;font-weight:700;font-size:16px;padding:0
}
@media(min-width:700px){
  .app-shell{max-width:680px;margin:auto}
}

</style>
</head>

const SUPABASE_URL = 'https://lvrvjxghsxqkflcvjkhx.supabase.co';
const SUPABASE_KEY = 'sb_publishable_bakcdWKDHgMH7lUvgb57Eg_F5Ul4-4d';
let currentSession = JSON.parse(localStorage.getItem('fcbb_session') || 'null');


async function ensureSession(){
  if(!currentSession) throw new Error('Session expirée. Reconnecte-toi.');

  // If access token is still valid for at least 60 seconds, keep it.
  try{
    const payload = JSON.parse(atob(currentSession.access_token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')));
    if(payload.exp && (payload.exp * 1000) > Date.now() + 60000) return currentSession;
  }catch(e){}

  if(!currentSession.refresh_token) throw new Error('Session expirée. Reconnecte-toi.');

  const response = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=refresh_token`, {
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
    body:JSON.stringify({refresh_token: currentSession.refresh_token})
  });
  const data = await response.json();
  if(!response.ok){
    localStorage.removeItem('fcbb_session');
    currentSession = null;
    throw new Error('Session expirée. Reconnecte-toi.');
  }
  currentSession = data;
  localStorage.setItem('fcbb_session', JSON.stringify(data));
  return currentSession;
}

async function sbFetch(path, options={}){
  const session = await ensureSession();
  const headers = Object.assign({
    'apikey': SUPABASE_KEY,
    'Authorization': `Bearer ${session.access_token}`
  }, options.headers || {});
  return fetch(`${SUPABASE_URL}${path}`, Object.assign({}, options, {headers}));
}

function escapeHtml(value=''){
  return String(value)
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

      <div class="form-group"><label>Mot de passe</label><input id="login-password" type="password" autocomplete="current-password" placeholder="Votre mot de passe"></div>
      <div id="login-message" class="muted" style="margin-bottom:12px"></div>
      <button id="login-button" class="btn-primary" style="width:100%" onclick="realLogin()">Se connecter</button>
    </div>
  </main>`;

async function realLogin(){
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const message = document.getElementById('login-message');
  const button = document.getElementById('login-button');

  if(!email || !password){
    message.textContent = 'Entre ton e-mail et ton mot de passe.';
    return;
  }

  button.disabled = true;
  button.textContent = 'Connexion...';
  message.textContent = '';

  try{
    const authResponse = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({email, password})
    });

    const authData = await authResponse.json();
    if(!authResponse.ok) throw new Error(authData.error_description || authData.msg || 'Connexion impossible.');

    currentSession = authData;
    localStorage.setItem('fcbb_session', JSON.stringify(authData));

    const profileResponse = await fetch(`${SUPABASE_URL}/rest/v1/profils?id=eq.${encodeURIComponent(authData.user.id)}&select=role,prenom,nom`, {
      headers: {
        'apikey': SUPABASE_KEY,
        'Authorization': `Bearer ${authData.access_token}`
      }
    });

    const profiles = await profileResponse.json();
    if(!profileResponse.ok) throw new Error('Impossible de lire le profil FCBB.');

    const profile = profiles[0];
    if(!profile){
      localStorage.removeItem('fcbb_session');
      currentSession = null;
      throw new Error("Ce compte n'a pas encore de profil FCBB.");
    }

    state.role = profile.role;
    state.page = profile.role === 'dirigeant' ? 'manager' : 'player';
    render();
  }catch(err){
    message.textContent = err.message || 'Erreur de connexion.';
  }finally{
    button.disabled = false;
    button.textContent = 'Se connecter';
  }
}

let fcbbTeams=[], fcbbPlayers=[], fcbbEvents=[];
async function loadBaseData(){
  const [tr,pr,er]=await Promise.all([
    sbFetch('/rest/v1/equipes?select=id,nom&actif=eq.true&order=nom.asc'),
    sbFetch('/rest/v1/joueurs?select=id,prenom,nom,numero,poste,photo_url,actif,user_id,equipe_id&actif=eq.true&order=nom.asc,prenom.asc'),
    sbFetch('/rest/v1/evenements?select=*&order=date_heure.desc')
  ]);
  const t=await tr.json(),p=await pr.json(),e=await er.json();
  if(!tr.ok) throw new Error(t.message||'Erreur équipes'); if(!pr.ok) throw new Error(p.message||'Erreur joueurs'); if(!er.ok) throw new Error(e.message||'Erreur événements');
  fcbbTeams=t;fcbbPlayers=p;fcbbEvents=e;
}
function teamName(id){return fcbbTeams.find(t=>t.id===id)?.nom||'Équipe'}
function fmtDate(v){return v?new Date(v).toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'}):''}
function eventLabel(e){return `${teamName(e.equipe_id)} • ${e.type==='match'?(e.adversaire||'Match'):'Entraînement'} • ${fmtDate(e.date_heure)}`}
function eventSelect(events,id){return `<select id="${id}"><option value="">Choisir</option>${events.map(e=>`<option value="${e.id}">${escapeHtml(eventLabel(e))}</option>`).join('')}</select>`}
function teamSelect(id){return `<select id="${id}"><option value="">Choisir</option>${fcbbTeams.map(t=>`<option value="${t.id}">${escapeHtml(t.nom)}</option>`).join('')}</select>`}

async function saveNotes(id){const rows=[...document.querySelectorAll('.nt-score')].filter(x=>x.value!=='').map(x=>({evenement_id:id,joueur_id:Number(x.dataset.p),note:Number(x.value),commentaire:document.querySelector(`.nt-comment[data-p="${x.dataset.p}"]`).value.trim()||null}));await sbFetch(`/rest/v1/notes_joueurs?evenement_id=eq.${id}`,{method:'DELETE'});if(!rows.length){document.getElementById('nt-msg').textContent='Aucune note.';return}const r=await sbFetch('/rest/v1/notes_joueurs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rows)});document.getElementById('nt-msg').textContent=r.ok?'Notes enregistrées ✅':((await r.json()).message||'Erreur')}

async function loadPlayerLive(){const box=document.getElementById('player-live');if(!box)return;try{const s=await ensureSession(),r=await sbFetch(`/rest/v1/joueurs?user_id=eq.${encodeURIComponent(s.user.id)}&select=*`),arr=await r.json(),me=arr[0];if(!me){box.innerHTML='<div class="card">Ce compte n’est pas encore relié à une fiche joueur.</div>';return}await loadBaseData();const events=fcbbEvents.filter(e=>e.equipe_id===me.equipe_id&&new Date(e.date_heure)>=new Date()).sort((a,b)=>new Date(a.date_heure)-new Date(b.date_heure)).slice(0,8),[dr,cr,nr,sr]=await Promise.all([sbFetch(`/rest/v1/disponibilites?joueur_id=eq.${me.id}&select=*`),sbFetch(`/rest/v1/convocations?joueur_id=eq.${me.id}&select=*`),sbFetch(`/rest/v1/notes_joueurs?joueur_id=eq.${me.id}&select=*`),sbFetch(`/rest/v1/statistiques_match?joueur_id=eq.${me.id}&select=*`)]),avail=await dr.json(),calls=await cr.json(),notes=await nr.json(),stats=await sr.json(),am=Object.fromEntries(avail.map(x=>[x.evenement_id,x.statut])),cm=Object.fromEntries(calls.map(x=>[x.evenement_id,x])),tot=stats.reduce((a,x)=>{a.m++;a.b+=x.buts||0;a.p+=x.passes_decisives||0;a.y+=x.cartons_jaunes||0;a.r+=x.cartons_rouges||0;return a},{m:0,b:0,p:0,y:0,r:0});box.innerHTML=`<div class="card profile">${me.photo_url?`<img class="avatar" src="${escapeHtml(me.photo_url)}">`:'<div class="avatar"></div>'}<div><h2 style="margin:0">${escapeHtml(me.prenom)} ${escapeHtml(me.nom)}</h2><div class="muted">#${me.numero??'—'} • ${escapeHtml(me.poste||'')}</div><div>${escapeHtml(teamName(me.equipe_id))}</div></div></div><h2 class="section-title">Mes disponibilités</h2><div class="list">${events.map(e=>`<div class="card"><strong>${escapeHtml(eventLabel(e))}</strong><p class="muted">${am[e.id]?`Réponse : ${am[e.id]}`:'En attente de votre réponse'}</p><div class="action-row"><button class="btn-choice present" onclick="saveAvailability(${me.id},${e.id},'present')">Présent</button><button class="btn-choice absent" onclick="saveAvailability(${me.id},${e.id},'absent')">Absent</button></div>${e.type==='match'?`<p><strong>Convocation :</strong> ${e.convocation_publiee?(cm[e.id]?.convoque?'✅ CONVOQUÉ':'❌ NON CONVOQUÉ'):'Pas encore publiée'}</p>`:''}</div>`).join('')}</div><h2 class="section-title">Mes statistiques</h2><div class="stat-grid">${[['Matchs',tot.m],['Buts',tot.b],['Passes',tot.p],['Jaunes',tot.y],['Rouges',tot.r]].map(x=>`<div class="card stat"><strong>${x[1]}</strong>${x[0]}</div>`).join('')}</div><h2 class="section-title">Mes notes</h2><div class="list">${notes.map(n=>`<div class="card"><div class="row"><strong>Match #${n.evenement_id}</strong><span class="badge yellow">${n.note}/10</span></div>${n.commentaire?`<p>${escapeHtml(n.commentaire)}</p>`:''}</div>`).join('')||'<div class="card">Aucune note.</div>'}</div>`}catch(e){box.innerHTML=`<div class="card">${escapeHtml(e.message)}</div>`}}
async function saveAvailability(player,event,status){const r=await sbFetch(`/rest/v1/disponibilites?joueur_id=eq.${player}&evenement_id=eq.${event}&select=id`),rows=await r.json();let q;if(rows.length)q=await sbFetch(`/rest/v1/disponibilites?id=eq.${rows[0].id}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({statut:status,updated_at:new Date().toISOString()})});else q=await sbFetch('/rest/v1/disponibilites',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({joueur_id:player,evenement_id:event,statut:status})});if(q.ok)loadPlayerLive();else alert((await q.json()).message||'Erreur')}

let managerPlayersCache = [];
let managerTeamsCache = [];

async function loadManagerPlayers(){
  const list = document.getElementById('manager-player-list');
  if(!list) return;
  try{
    const [playersRes, teamsRes] = await Promise.all([
      sbFetch('/rest/v1/joueurs?select=id,prenom,nom,numero,poste,photo_url,actif,equipe_id&order=nom.asc,prenom.asc'),
      sbFetch('/rest/v1/equipes?select=id,nom&actif=eq.true&order=nom.asc')
    ]);
    const players = await playersRes.json();
    const teams = await teamsRes.json();
    if(!playersRes.ok) throw new Error(players.message || 'Impossible de charger les joueurs.');
    if(!teamsRes.ok) throw new Error(teams.message || 'Impossible de charger les équipes.');

    managerPlayersCache = players;
    managerTeamsCache = teams;
    renderTeamSelect();

    if(players.length === 0){
      list.innerHTML = `<div class="card"><strong>Aucun joueur pour le moment.</strong><p class="muted">Appuie sur “Ajouter un joueur”.</p></div>`;
      return;
    }

    const teamMap = Object.fromEntries(teams.map(t=>[t.id,t.nom]));
    list.innerHTML = `<div class="list">${players.map(p=>`
      <div class="card player-card" style="${p.actif ? '' : 'opacity:.55'}">
        ${p.photo_url
          ? `<img class="avatar" src="${escapeHtml(p.photo_url)}" alt="">`
          : `<div class="avatar" style="display:grid;place-items:center;font-size:28px">👤</div>`}
        <div style="flex:1">
          <strong>${escapeHtml(p.prenom)} ${escapeHtml(p.nom)}</strong>
          <div class="muted">#${p.numero ?? '—'} • ${escapeHtml(p.poste || 'Poste non renseigné')}</div>
          <div class="small">${escapeHtml(teamMap[p.equipe_id] || 'Équipe non renseignée')} ${p.actif ? '' : '• Inactif'}</div>
        </div>
        <button class="btn-primary" style="padding:9px 12px" onclick="editPlayer(${p.id})">Modifier</button>
      </div>`).join('')}</div>`;
  }catch(err){
    list.innerHTML = `<div class="card"><strong>Erreur</strong><p>${escapeHtml(err.message)}</p></div>`;
  }
}

function renderTeamSelect(selectedId=''){
  const select = document.getElementById('player-team');
  if(!select) return;
  select.innerHTML = `<option value="">Choisir une équipe</option>` +
    managerTeamsCache.map(t=>`<option value="${t.id}" ${String(t.id)===String(selectedId)?'selected':''}>${escapeHtml(t.nom)}</option>`).join('');
}

function openPlayerForm(){
  document.getElementById('player-form-wrap').classList.remove('hidden');
  document.getElementById('player-form-title').textContent = 'Ajouter un joueur';
  document.getElementById('player-id').value = '';
  document.getElementById('player-current-photo').value = '';
  document.getElementById('player-firstname').value = '';
  document.getElementById('player-lastname').value = '';
  document.getElementById('player-number').value = '';
  document.getElementById('player-position').value = '';
  document.getElementById('player-photo').value = '';
  document.getElementById('photo-preview-wrap').innerHTML = '';
  document.getElementById('player-form-message').textContent = '';
  renderTeamSelect('');
  window.scrollTo({top:0,behavior:'smooth'});
}

function closePlayerForm(){
  document.getElementById('player-form-wrap').classList.add('hidden');
}

function editPlayer(id){
  const p = managerPlayersCache.find(x=>x.id===id);
  if(!p) return;
  openPlayerForm();
  document.getElementById('player-form-title').textContent = 'Modifier le joueur';
  document.getElementById('player-id').value = p.id;
  document.getElementById('player-current-photo').value = p.photo_url || '';
  document.getElementById('player-firstname').value = p.prenom || '';
  document.getElementById('player-lastname').value = p.nom || '';
  document.getElementById('player-number').value = p.numero ?? '';
  document.getElementById('player-position').value = p.poste || '';
  renderTeamSelect(p.equipe_id);
  document.getElementById('photo-preview-wrap').innerHTML = p.photo_url
    ? `<img class="avatar" src="${escapeHtml(p.photo_url)}" alt="Photo actuelle">`
    : '';
}

async function uploadPlayerPhoto(file){
  if(!file) return null;
  const ext = (file.name.split('.').pop() || 'jpg').replace(/[^a-zA-Z0-9]/g,'').toLowerCase();
  const safeName = `joueur_${Date.now()}_${Math.random().toString(36).slice(2,8)}.${ext}`;
  const objectPath = encodeURIComponent(safeName);
  const response = await sbFetch(`/storage/v1/object/photos-joueurs/${objectPath}`, {
    method:'POST',
    headers:{
      'Content-Type': file.type || 'image/jpeg',
      'x-upsert':'true'
    },
    body:file
  });
  if(!response.ok){
    let msg='Échec de l’envoi de la photo.';
    try{ const e=await response.json(); msg=e.message || e.error || msg; }catch(_){}
    throw new Error(msg);
  }
  return `${SUPABASE_URL}/storage/v1/object/public/photos-joueurs/${objectPath}`;
}

async function savePlayer(){
  const id = document.getElementById('player-id').value;
  const firstname = document.getElementById('player-firstname').value.trim();
  const lastname = document.getElementById('player-lastname').value.trim();
  const numberRaw = document.getElementById('player-number').value;
  const position = document.getElementById('player-position').value;
  const teamId = document.getElementById('player-team').value;
  const file = document.getElementById('player-photo').files[0];
  const currentPhoto = document.getElementById('player-current-photo').value;
  const message = document.getElementById('player-form-message');

  if(!firstname || !lastname || !teamId){
    message.textContent = 'Prénom, nom et équipe sont obligatoires.';
    return;
  }

  message.textContent = 'Enregistrement...';

  try{
    const photoUrl = file ? await uploadPlayerPhoto(file) : (currentPhoto || null);
    const payload = {
      prenom: firstname,
      nom: lastname,
      numero: numberRaw === '' ? null : Number(numberRaw),
      poste: position || null,
      equipe_id: Number(teamId),
      photo_url: photoUrl,
      actif: true
    };

    const response = await sbFetch(id ? `/rest/v1/joueurs?id=eq.${id}` : '/rest/v1/joueurs', {
      method: id ? 'PATCH' : 'POST',
      headers:{
        'Content-Type':'application/json',
        'Prefer':'return=minimal'
      },
      body:JSON.stringify(payload)
    });

    if(!response.ok){
      let msg='Impossible d’enregistrer le joueur.';
      try{ const e=await response.json(); msg=e.message || e.details || msg; }catch(_){}
      throw new Error(msg);
    }

    message.textContent = 'Joueur enregistré ✅';
    closePlayerForm();
    await loadManagerPlayers();
  }catch(err){
    message.textContent = err.message;
  }
}

async function togglePlayerActive(id, active){
  const response = await sbFetch(`/rest/v1/joueurs?id=eq.${id}`, {
    method:'PATCH',
    headers:{'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({actif: active})
  });
  if(response.ok) await loadManagerPlayers();
}

  return `<header class="hero"><button class="top-back" onclick="go('home')">← Retour</button><h1>${title}</h1></header>
  <main class="page"><div class="card">${body}</div></main>${nav(state.page)}`;
}

function squad(){
  return `<header class="hero"><button class="top-back" onclick="go('home')">← Retour</button><h1>Effectif Senior A</h1></header>
  <main class="page"><div class="list">
  ${players.map(p=>`<div class="card player-card">
    <div class="avatar"></div>
    <div><strong>${p.name}</strong><div class="muted">#${p.number} • ${p.position}</div><div class="small">${p.team}</div></div>
  </div>`).join('')}

function render(){
  let html='';
  if(state.page==='home') html=home();
  else if(state.page==='login') html=login();
  else if(state.page==='player') html=playerDashboard();
  else if(state.page==='manager') html=managerDashboard();
  else if(state.page==='managerPlayers') html=managerPlayersPage();
  else if(state.page==='managerEvents') html=managerEventsPage();
  else if(state.page==='managerAttendance') html=managerAttendancePage();
  else if(state.page==='managerCalls') html=managerCallsPage();
  else if(state.page==='managerLineups') html=managerLineupsPage();
  else if(state.page==='managerResults') html=managerResultsPage();
  else if(state.page==='managerStats') html=managerStatsPage();
  else if(state.page==='managerNotes') html=managerNotesPage();
  else if(state.page==='squad') html=squad();
  else if(state.page==='matches') html=generic('Matchs','Prochains matchs et résultats du club.');
  else if(state.page==='teams') html=generic('Équipes',teams.join(' • '));
  else if(state.page==='rankings') html=generic('Classements','Classements des équipes et classements internes des buteurs/passeurs.');
  else if(state.page==='club') html=generic('Le Club',"Histoire du FC Bouvigny-Boyeffles, valeurs du club et informations pratiques.");
  document.getElementById('app').innerHTML=`<div class="app-shell">${html}</div>`;
  window.scrollTo(0,0);
  if(state.page==='managerPlayers') setTimeout(loadManagerPlayers,0);
  if(state.page==='managerEvents') setTimeout(initEvents,0);
  if(state.page==='managerAttendance') setTimeout(initAttendance,0);
  if(state.page==='managerCalls') setTimeout(initCalls,0);
  if(state.page==='managerLineups') setTimeout(initLineups,0);
  if(state.page==='managerResults') setTimeout(initResults,0);
  if(state.page==='managerStats') setTimeout(initStats,0);
  if(state.page==='managerNotes') setTimeout(initNotes,0);
  if(state.page==='player') setTimeout(loadPlayerLive,0);
}
function go(page){state.page=page;render()}
function demo(role){state.role=role;state.page=role==='player'?'player':'manager';render()}
function logout(){currentSession=null;localStorage.removeItem('fcbb_session');state.role=null;state.page='home';render()}
function setAvailability(kind,value){
  if(kind==='training') state.availabilityTraining=value;
  if(kind==='match') state.availabilityMatch=value;
  render();
}
render();
